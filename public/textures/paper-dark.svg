<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="noise-dark" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" seed="5"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.78  0 0 0 0 0.58  0 0 0 0 0.30  0 0 0 0.07 0"/>
    </filter>
    <filter id="stains-dark" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" seed="9"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.65  0 0 0 0 0.35  0 0 0 0.08 0"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#1c140a"/>
  <rect width="100%" height="100%" filter="url(#noise-dark)"/>
  <rect width="100%" height="100%" filter="url(#stains-dark)" opacity="0.5"/>
  <g stroke="#c8956c" stroke-width="0.5" opacity="0.1" fill="none">
    <path d="M 20 50 Q 80 48 140 52 T 260 50"/>
    <path d="M 60 320 Q 140 322 220 318 T 360 322"/>
  </g>
  <g fill="#f0d9a8" opacity="0.04">
    <circle cx="80" cy="120" r="1"/>
    <circle cx="320" cy="80" r="0.8"/>
    <circle cx="200" cy="280" r="1.2"/>
  </g>
</svg>
