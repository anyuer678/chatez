<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" seed="3"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.32  0 0 0 0 0.18  0 0 0 0.08 0"/>
    </filter>
    <filter id="stains" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="7"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.42  0 0 0 0 0.22  0 0 0 0.06 0"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#f4ecd8"/>
  <rect width="100%" height="100%" filter="url(#noise)"/>
  <rect width="100%" height="100%" filter="url(#stains)" opacity="0.6"/>
  <g stroke="#8b6f47" stroke-width="0.5" opacity="0.12" fill="none">
    <path d="M 20 50 Q 80 48 140 52 T 260 50"/>
    <path d="M 60 320 Q 140 322 220 318 T 360 322"/>
    <path d="M 30 180 Q 90 178 150 182"/>
  </g>
  <g fill="#3a2e1f" opacity="0.05">
    <circle cx="80" cy="120" r="1"/>
    <circle cx="320" cy="80" r="0.8"/>
    <circle cx="200" cy="280" r="1.2"/>
    <circle cx="350" cy="220" r="0.9"/>
    <circle cx="120" cy="360" r="0.7"/>
  </g>
</svg>
